<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 IoT Dashboard - Suhu & Kelembapan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- MQTT.js CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 flex flex-col items-center py-10 px-4 font-sans">

    <!-- Header -->
    <header class="w-full max-w-4xl mb-8 flex flex-col sm:flex-row justify-between items-center bg-slate-800/50 border border-slate-700/60 p-6 rounded-2xl shadow-xl backdrop-blur-md">
        <div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
                ESP32 IoT Dashboard
            </h1>
            <p class="text-sm text-slate-400 mt-1">Monitoring Suhu & Kelembapan Ruangan Real-Time</p>
        </div>
        <div class="mt-4 sm:mt-0 flex items-center gap-3 bg-slate-900/80 px-4 py-2 rounded-full border border-slate-700">
            <span id="connection-status-dot" class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="connection-status-text" class="text-xs font-medium text-slate-300">Menghubungkan ke MQTT...</span>
        </div>
    </header>

    <!-- Content Grid (Kartu Angka) -->
    <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        
        <!-- Card Suhu -->
        <div class="bg-slate-800/70 border border-slate-700/80 rounded-2xl p-6 shadow-xl flex flex-col justify-between relative overflow-hidden group hover:border-blue-500/50 transition-all">
            <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-blue-500/10 rounded-full blur-2xl group-hover:bg-blue-500/20 transition-all"></div>
            <div class="flex items-center justify-between">
                <span class="text-sm font-semibold uppercase tracking-wider text-slate-400">Suhu Ruangan</span>
                <div class="p-2.5 bg-blue-500/10 text-blue-400 rounded-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                </div>
            </div>
            <div class="my-6 flex items-baseline gap-2">
                <span id="temp-value" class="text-5xl font-black tracking-tight text-white">--</span>
                <span class="text-xl font-bold text-blue-400">°C</span>
            </div>
            <div class="text-xs text-slate-500">Topik: esp32/ruangan1/suhu</div>
        </div>

        <!-- Card Kelembapan -->
        <div class="bg-slate-800/70 border border-slate-700/80 rounded-2xl p-6 shadow-xl flex flex-col justify-between relative overflow-hidden group hover:border-cyan-500/50 transition-all">
            <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-cyan-500/10 rounded-full blur-2xl group-hover:bg-cyan-500/20 transition-all"></div>
            <div class="flex items-center justify-between">
                <span class="text-sm font-semibold uppercase tracking-wider text-slate-400">Kelembapan Udara</span>
                <div class="p-2.5 bg-cyan-500/10 text-cyan-400 rounded-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </div>
            </div>
            <div class="my-6 flex items-baseline gap-2">
                <span id="hum-value" class="text-5xl font-black tracking-tight text-white">--</span>
                <span class="text-xl font-bold text-cyan-400">%</span>
            </div>
            <div class="text-xs text-slate-500">Topik: esp32/ruangan1/kelembaban</div>
        </div>

    </div>

    <!-- Grafik Section -->
    <section class="w-full max-w-4xl bg-slate-800/70 border border-slate-700/80 rounded-2xl p-6 shadow-xl">
        <h2 class="text-lg font-bold mb-4 text-slate-200">Grafik Riwayat Sensor</h2>
        <div class="relative w-full h-72 sm:h-80">
            <canvas id="sensorChart"></canvas>
        </div>
    </section>

    <!-- Skrip Logika MQTT & Chart.js -->
    <script>
        // Inisialisasi Grafik Chart.js
        const ctx = document.getElementById('sensorChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Suhu (°C)',
                        borderColor: '#60a5fa',
                        backgroundColor: 'rgba(96, 165, 250, 0.1)',
                        data: [],
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true
                    },
                    {
                        label: 'Kelembapan (%)',
                        borderColor: '#22d3ee',
                        backgroundColor: 'rgba(34, 211, 238, 0.1)',
                        data: [],
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: 'rgba(51, 65, 85, 0.4)' }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: 'rgba(51, 65, 85, 0.4)' }, ticks: { color: '#94a3b8' } }
                },
                plugins: {
                    legend: { labels: { color: '#e2e8f0' } }
                }
            }
        });

        // Koneksi MQTT via WebSocket (Menggunakan HiveMQ Public Broker WSS)
        const brokerUrl = 'wss://0bd0faf204644336bd0cafb544d2e1b0.s1.eu.hivemq.cloud:8884/mqtt';
        const client = mqtt.connect(brokerUrl, {
            username: 'gilangekprtm', 
            password: 'gilangekprtm12', 
            clean: true
        });
        

        const statusDot = document.getElementById('connection-status-dot');
        const statusText = document.getElementById('connection-status-text');
        const tempEl = document.getElementById('temp-value');
        const humEl = document.getElementById('hum-value');

        client.on('connect', () => {
            console.log('Terhubung ke MQTT Broker');
            statusDot.className = 'w-3 h-3 rounded-full bg-emerald-500';
            statusText.innerText = 'Terhubung (Live)';
            
            // Subscribe ke topik ESP32
            client.subscribe('esp32/ruangan1/suhu');
            client.subscribe('esp32/ruangan1/kelembaban');
        });

        client.on('error', (err) => {
            console.error('Koneksi Gagal: ', err);
            statusDot.className = 'w-3 h-3 rounded-full bg-rose-500';
            statusText.innerText = 'Koneksi Gagal';
        });

        client.on('message', (topic, payload) => {
            const message = payload.toString();
            const timeNow = new Date().toLocaleTimeString();

            if (topic === 'esp32/ruangan1/suhu') {
                tempEl.innerText = parseFloat(message).toFixed(1);
                
                // Masukkan data ke Grafik Suhu
                if (chart.data.labels.length > 15) {
                    chart.data.labels.shift();
                    chart.data.datasets[0].data.shift();
                }
                chart.data.labels.push(timeNow);
                chart.data.datasets[0].data.push(parseFloat(message));
                chart.update();
            } 
            
            if (topic === 'esp32/ruangan1/kelembaban') {
                humEl.innerText = parseFloat(message).toFixed(1);
                
                // Masukkan data ke Grafik Kelembapan
                if (chart.data.datasets[1].data.length > 15) {
                    chart.data.datasets[1].data.shift();
                }
                chart.data.datasets[1].data.push(parseFloat(message));
                chart.update();
            }
        });
    </script>
</body>
</html>
