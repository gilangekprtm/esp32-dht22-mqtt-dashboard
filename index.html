<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 IoT Dashboard - Suhu & Kelembapan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- MQTT.js CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 flex flex-col items-center py-10 px-4 font-sans">

    <!-- Header -->
    <header class="w-full max-w-4xl mb-8 flex flex-col sm:flex-row justify-between items-center bg-slate-800/50 border border-slate-700/60 p-6 rounded-2xl shadow-xl backdrop-blur-md">
        <div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
                ESP32 IoT Dashboard
            </h1>
            <p class="text-sm text-slate-400 mt-1">Monitoring Suhu & Kelembapan Ruangan Real-Time</p>
        </div>
        <div class="mt-4 sm:mt-0 flex items-center gap-3 bg-slate-900/80 px-4 py-2 rounded-full border border-slate-700">
            <span id="connection-status-dot" class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="connection-status-text" class="text-xs font-medium text-slate-300">Menghubungkan ke MQTT...</span>
        </div>
    </header>

    <!-- Speedometer Sensor -->
    <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div class="bg-slate-800/70 border border-slate-700/80 rounded-2xl p-6 shadow-xl text-center">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Suhu Ruangan</h2>
            <div class="relative h-48 mt-2">
                <canvas id="temperatureGauge"></canvas>
                <div class="absolute inset-x-0 bottom-2">
                    <span id="temp-value" class="text-4xl font-black text-white">--</span>
                    <span class="text-lg font-bold text-blue-400">°C</span>
                </div>
            </div>
            <div class="text-xs text-slate-500">Suhu</div>
        </div>
        <div class="bg-slate-800/70 border border-slate-700/80 rounded-2xl p-6 shadow-xl text-center">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Kelembapan Udara</h2>
            <div class="relative h-48 mt-2">
                <canvas id="humidityGauge"></canvas>
                <div class="absolute inset-x-0 bottom-2">
                    <span id="hum-value" class="text-4xl font-black text-white">--</span>
                    <span class="text-lg font-bold text-cyan-400">%</span>
                </div>
            </div>
            <div class="text-xs text-slate-500">Kelembaban</div>
        </div>
    </div>

    <!-- Statistik Section -->
    <section class="w-full max-w-4xl bg-slate-800/70 border border-slate-700/80 rounded-2xl p-6 shadow-xl">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
            <h2 class="text-lg font-bold text-slate-200">Statistik Sensor</h2>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full min-w-[480px] text-left">
                <thead>
                    <tr class="border-b border-slate-700 text-xs uppercase tracking-wider text-slate-500">
                        <th class="px-3 py-3 font-medium">Sensor</th>
                        <th class="px-3 py-3 text-right font-medium">Rata-rata</th>
                        <th class="px-3 py-3 text-right font-medium">Maksimal</th>
                        <th class="px-3 py-3 text-right font-medium">Minimal</th>
                    </tr>
                </thead>
                <tbody class="text-sm">
                    <tr class="border-b border-slate-700/70">
                        <th class="px-3 py-4 font-medium text-blue-400">Suhu (°C)</th>
                        <td id="temp-average" class="px-3 py-4 text-right font-semibold text-slate-200">--</td>
                        <td id="temp-maximum" class="px-3 py-4 text-right font-semibold text-slate-200">--</td>
                        <td id="temp-minimum" class="px-3 py-4 text-right font-semibold text-slate-200">--</td>
                    </tr>
                    <tr>
                        <th class="px-3 py-4 font-medium text-cyan-400">Kelembapan (%)</th>
                        <td id="hum-average" class="px-3 py-4 text-right font-semibold text-slate-200">--</td>
                        <td id="hum-maximum" class="px-3 py-4 text-right font-semibold text-slate-200">--</td>
                        <td id="hum-minimum" class="px-3 py-4 text-right font-semibold text-slate-200">--</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- Skrip Logika MQTT & Chart.js -->
    <script>
        function createGauge(canvasId, min, max, colors) {
            return new Chart(document.getElementById(canvasId), {
                type: 'doughnut',
                data: { datasets: [{ data: [0, max - min], backgroundColor: colors, borderWidth: 0 }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    rotation: -90,
                    circumference: 180,
                    cutout: '72%',
                    animation: { duration: 900, easing: 'easeInOutQuart' },
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    }
                }
            });
        }

        const temperatureGauge = createGauge('temperatureGauge', -10, 50, ['#60a5fa', '#1e293b']);
        const humidityGauge = createGauge('humidityGauge', 0, 100, ['#22d3ee', '#1e293b']);
        // Koneksi MQTT via WebSocket (Menggunakan HiveMQ Public Broker WSS)
        const brokerUrl = 'wss://0bd0faf204644336bd0cafb544d2e1b0.s1.eu.hivemq.cloud:8884/mqtt';
        const client = mqtt.connect(brokerUrl, {
            username: 'gilangekprtm', 
            password: 'gilangekprtm12', 
            clean: true
        });
        

        const statusDot = document.getElementById('connection-status-dot');
        const statusText = document.getElementById('connection-status-text');
        const tempEl = document.getElementById('temp-value');
        const humEl = document.getElementById('hum-value');
        const statisticElements = {
            temperature: {
                average: document.getElementById('temp-average'),
                maximum: document.getElementById('temp-maximum'),
                minimum: document.getElementById('temp-minimum')
            },
            humidity: {
                average: document.getElementById('hum-average'),
                maximum: document.getElementById('hum-maximum'),
                minimum: document.getElementById('hum-minimum')
            }
        };
        const sensorHistory = [];
        let latestTemperature = null;
        let latestHumidity = null;

        function updateGauge(gauge, value, min, max) {
            const clampedValue = Math.max(min, Math.min(max, value));
            gauge.data.datasets[0].data = [clampedValue - min, max - clampedValue];
            gauge.update();
        }

        function getStats(values) {
            return {
                average: values.reduce((sum, current) => sum + current, 0) / values.length,
                maximum: Math.max(...values),
                minimum: Math.min(...values)
            };
        }

        function renderStatistics() {
            const visibleHistory = sensorHistory.filter((sample) => sample.temperature !== null && sample.humidity !== null);
            const temperatures = visibleHistory.map((sample) => sample.temperature);
            const humidities = visibleHistory.map((sample) => sample.humidity);

            if (temperatures.length === 0) {
                return;
            }

            const temperatureStats = getStats(temperatures);
            const humidityStats = getStats(humidities);
            Object.entries(temperatureStats).forEach(([statistic, value]) => {
                statisticElements.temperature[statistic].innerText = value.toFixed(1);
            });
            Object.entries(humidityStats).forEach(([statistic, value]) => {
                statisticElements.humidity[statistic].innerText = value.toFixed(1);
            });
        }

        client.on('connect', () => {
            console.log('Terhubung ke MQTT Broker');
            statusDot.className = 'w-3 h-3 rounded-full bg-emerald-500';
            statusText.innerText = 'Terhubung (Live)';
            
            // Subscribe ke topik ESP32
            client.subscribe('esp32/ruangan1/suhu');
            client.subscribe('esp32/ruangan1/kelembaban');
        });

        client.on('error', (err) => {
            console.error('Koneksi Gagal: ', err);
            statusDot.className = 'w-3 h-3 rounded-full bg-rose-500';
            statusText.innerText = 'Koneksi Gagal';
        });

        client.on('message', (topic, payload) => {
            const message = payload.toString();
            const timeNow = new Date().toLocaleTimeString();
            const value = parseFloat(message);

            if (Number.isNaN(value)) {
                return;
            }

            if (topic === 'esp32/ruangan1/suhu') {
                latestTemperature = value;
                tempEl.innerText = value.toFixed(1);
                updateGauge(temperatureGauge, value, -10, 50);
            } 
            
            if (topic === 'esp32/ruangan1/kelembaban') {
                latestHumidity = value;
                humEl.innerText = value.toFixed(1);
                updateGauge(humidityGauge, value, 0, 100);
            }

            if (topic === 'esp32/ruangan1/suhu' || topic === 'esp32/ruangan1/kelembaban') {
                sensorHistory.push({ time: timeNow, temperature: latestTemperature, humidity: latestHumidity });
                if (sensorHistory.length > 60) {
                    sensorHistory.shift();
                }
                renderStatistics();
            }
        });
    </script>
</body>
</html>
